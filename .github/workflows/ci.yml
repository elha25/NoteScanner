name: Tester

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Systempakker (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Installer
        run: python -m pip install -r requirements-dev.txt
      - name: Tester
        run: python -m pytest -q tests
      - name: Røyktest
        run: python selvtest.py
